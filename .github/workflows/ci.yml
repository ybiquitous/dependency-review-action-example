name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: true
          fail-on-severity: low
          warn-on-openssf-scorecard-level: 7

  bundler-audit:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Run bundler-audit
        id: bundler-audit
        run: |
          json_file="${RUNNER_TEMP}/bundler-audit.json"
          set +e
          bin/bundler-audit check --update --format json --output "${json_file}"
          exit_code="${PIPESTATUS[0]}"
          set -e

          cat "${json_file}"

          table_file="${RUNNER_TEMP}/bundler-audit-table.md"
          {
            echo '| Gem | Version | Advisory | Criticality | Title |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r '.results[] | select(.gem and .advisory) |
              "| \(.gem.name) | \(.gem.version) | [\(.advisory.id)](\(.advisory.url)) | \(.advisory.criticality // "unknown") | \(.advisory.title) |"' \
              "${json_file}"
          } > "${table_file}"

          {
            echo '## Bundler Audit'
            cat "${table_file}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${exit_code}" -ne 0 ]]; then
            echo "::warning::bundler-audit found vulnerabilities, see the job summary for details"
          fi

          {
            echo "exit_code=${exit_code}"
            echo 'table<<BUNDLER_AUDIT_TABLE'
            cat "${table_file}"
            echo 'BUNDLER_AUDIT_TABLE'
          } >> "${GITHUB_OUTPUT}"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.bundler-audit.outputs.exit_code != '0'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: bundler-audit
          edit-mode: replace
          body: |
            ### :warning: Bundler Audit found vulnerabilities

            ${{ steps.bundler-audit.outputs.table }}
