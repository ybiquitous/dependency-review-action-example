name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  bundler-audit:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run bundler-audit
        run: |
          log_file="${RUNNER_TEMP}/bundler-audit.log"
          set +e
          bin/bundler-audit check --update --output "${log_file}"
          exit_code="${PIPESTATUS[0]}"
          set -e

          {
            echo '## Bundler Audit'
            echo '```'
            cat "${log_file}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${exit_code}"
