name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: true
          fail-on-severity: low
          warn-on-openssf-scorecard-level: 7

  bundler-audit:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Run bundler-audit
        run: |
          log_file="${RUNNER_TEMP}/bundler-audit.log"
          set +e
          bin/bundler-audit check --update --output "${log_file}"
          exit_code="${PIPESTATUS[0]}"
          set -e

          cat "${log_file}"
          {
            echo '## Bundler Audit'
            echo '```'
            cat "${log_file}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${exit_code}" -ne 0 ]]; then
            echo "::warning::bundler-audit found vulnerabilities, see the job summary for details"
          fi
